name: CI/CD Pipeline

on:
  push:
    branches: [ "develop" ]

jobs:
  # 1. COMPILAR Y VERIFICAR
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código EcfDgi.Client
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar Solución
        run: dotnet build EcfDgii.Client.slnx

      - name: Ejecutar Pruebas
        run: dotnet test EcfDgii.Client.slnx --configuration Release --verbosity normal

  # 2. AUTO-MERGE DE DEVELOP A MAIN
  automerge:
    name: Auto-Merge to main
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge develop into main and push
        if: github.event_name == 'push' && github.ref_name == 'develop'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-ff develop -m "Auto-merge develop to main"
          git push origin main
