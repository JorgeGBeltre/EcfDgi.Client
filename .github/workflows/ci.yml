name: CI/CD Pipeline - EcfDgi.Client

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  DOTNET_ENVIRONMENT: Production
  ASPNETCORE_ENVIRONMENT: Production

permissions:
  contents: read

jobs:
  build-test-and-deploy:
    name: Compilar, Probar y Desplegar EcfDgi.Client
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore EcfDgii.Client.slnx

      - name: Compilar solución
        run: dotnet build EcfDgii.Client.slnx -c Release --no-restore

      - name: Ejecutar pruebas unitarias
        run: dotnet test EcfDgii.Client.slnx -c Release --no-build --verbosity normal

      - name: Publicar API EcfDgi.Client
        run: |
          dotnet publish src/EcfDgii.Client.Api/EcfDgii.Client.Api.csproj -c Release -o ./publish /p:UseAppHost=false

      - name: Preparar Dockerfile para Runtime
        run: |
          cat > publish/Dockerfile <<'EOF'
          FROM mcr.microsoft.com/dotnet/aspnet:10.0-alpine
          WORKDIR /app
          RUN apk add --no-cache icu-libs tzdata
          COPY . .
          EXPOSE 8080
          ENV ASPNETCORE_URLS=http://+:8080
          ENTRYPOINT ["dotnet", "EcfDgii.Client.Api.dll"]
          EOF
          echo "Contenido generado en publish:"
          ls -la publish

      - name: Copiar artefactos al servidor VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SERVER }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          source: "publish/*"
          target: "/var/www/ecf-dgii-client/"
          strip_components: 1
          overwrite: true

      - name: Desplegar contenedor Docker vía SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          ASPNETCORE_ENVIRONMENT: Production
          DOTNET_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://+:8080
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          RNC_EMISOR: ${{ vars.DGII_RNC_EMISOR || secrets.DGII_RNC_EMISOR || '101889063' }}
          AMBIENTE: ${{ vars.DGII_AMBIENTE || secrets.DGII_AMBIENTE || 'Produccion' }}
          WORKER_SECRET_KEY: ${{ secrets.WORKER_SECRET_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CERT_PASSWORD: ${{ secrets.DGII_CERTIFICATE_PASSWORD }}
        with:
          host: ${{ secrets.HOSTINGER_SERVER }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          timeout: 120s
          command_timeout: 10m
          envs: ASPNETCORE_ENVIRONMENT,DOTNET_ENVIRONMENT,ASPNETCORE_URLS,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,REDIS_PASSWORD,RNC_EMISOR,AMBIENTE,WORKER_SECRET_KEY,JWT_SECRET,CERT_PASSWORD
          script: |
            set -e

            DEPLOY_PATH="/var/www/ecf-dgii-client"
            CONTAINER_NAME="ecf_dgii_api"
            IMAGE_NAME="ecf-dgii-api:latest"
            ENV_FILE="$DEPLOY_PATH/.env"

            cd "$DEPLOY_PATH"

            if [ -z "${WORKER_SECRET_KEY}" ]; then
              echo "ERROR: WORKER_SECRET_KEY secret is required."
              exit 1
            fi
            if [ -z "${JWT_SECRET}" ]; then
              echo "ERROR: JWT_SECRET secret is required."
              exit 1
            fi
            if [ -z "${POSTGRES_PASSWORD}" ]; then
              echo "ERROR: POSTGRES_PASSWORD secret is required."
              exit 1
            fi

            echo "Verificando archivos desplegados..."
            ls -la

            echo "Asegurando directorio de certificados..."
            mkdir -p "$DEPLOY_PATH/certificates"

            echo "Construyendo cadenas de conexión desde GitHub Secrets..."
            DB_NAME="${POSTGRES_DB:-ecf_db}"
            DB_USER="${POSTGRES_USER:-ecf_user}"
            DB_PASS="${POSTGRES_PASSWORD}"
            DEFAULT_DB_CONN="Host=ecf-postgres-db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASS}"

            if [ -n "$REDIS_PASSWORD" ]; then
              DEFAULT_REDIS_CONN="ecf-redis-db:6379,password=${REDIS_PASSWORD},abortConnect=false"
            else
              DEFAULT_REDIS_CONN="ecf-redis-db:6379,abortConnect=false"
            fi

            echo "Generando archivo .env de producción de forma segura..."
            cat > "$ENV_FILE" <<EOF
            ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
            DOTNET_ENVIRONMENT=${DOTNET_ENVIRONMENT}
            ASPNETCORE_URLS=${ASPNETCORE_URLS}
            ConnectionStrings__Redis=${DEFAULT_REDIS_CONN}
            ConnectionStrings__DefaultConnection=${DEFAULT_DB_CONN}
            RncEmisor=${RNC_EMISOR}
            Ambiente=${AMBIENTE}
            EcfClientOptions__Environment=${AMBIENTE}
            WorkerSecretKey=${WORKER_SECRET_KEY}
            WORKER_SECRET_KEY=${WORKER_SECRET_KEY}
            JwtSettings__Secret=${JWT_SECRET}
            EcfClientOptions__RncEmisor=${RNC_EMISOR}
            EcfEmisor__Rnc=${RNC_EMISOR}
            EcfClientOptions__CertificatePath=/app/certificates/default.pfx
            EcfClientOptions__CertificatePassword=${CERT_PASSWORD}
            EOF

            chmod 600 "$ENV_FILE"

            echo "Deteniendo contenedor previo si existe..."
            EXISTING_CONTAINER=$(docker ps -aq -f "name=^/${CONTAINER_NAME}$")
            if [ -n "$EXISTING_CONTAINER" ]; then
              docker stop "$CONTAINER_NAME" || true
              docker rm "$CONTAINER_NAME" || true
            else
              echo "No existe contenedor previo."
            fi

            echo "Construyendo imagen Docker..."
            docker build --no-cache -t "$IMAGE_NAME" .

            echo "Iniciando nuevo contenedor Docker integrado con Traefik..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --network netbird \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.ecf-dgii.rule=Host(\`dgii.app.willychicrd.com\`)" \
              --label "traefik.http.routers.ecf-dgii.entrypoints=websecure" \
              --label "traefik.http.routers.ecf-dgii.tls.certresolver=letsencrypt" \
              --label "traefik.http.services.ecf-dgii.loadbalancer.server.port=8080" \
              --add-host=host.docker.internal:host-gateway \
              -v "$DEPLOY_PATH/certificates:/app/certificates" \
              --env-file "$ENV_FILE" \
              --restart unless-stopped \
              "$IMAGE_NAME"

            echo "Validando contenedor..."
            docker ps -f "name=$CONTAINER_NAME"

            echo "Últimos logs del contenedor..."
            docker logs "$CONTAINER_NAME" --tail 30

            echo "✅ Despliegue de EcfDgi.Client completado exitosamente."
