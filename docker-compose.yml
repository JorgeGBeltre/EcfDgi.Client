version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ecf_dgii_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel notice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecf-network

  api:
    image: ecf_dgii_api
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecf_dgii_api
    ports:
      - "8085:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_SYSTEM_NET_DISABLE_IPV6=1
      # Conexión compartida a la base de datos central ecf_db
      - ConnectionStrings__DefaultConnection=Host=ecf-postgres;Port=5432;Database=ecf_db;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=ecf_dgii_redis:6379
      - EcfEmisor__Rnc=101889063
      - EcfClientOptions__RncEmisor=101889063
      - WorkerSecretKey=${WORKER_SECRET_KEY:-}
      - JwtSettings__Secret=${JWT_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ecf-network

volumes:
  redis_data:

networks:
  ecf-network:
    name: ecfapi_ecf-network
    external: true
